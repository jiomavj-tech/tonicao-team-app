services:
  - type: web
    name: tonicao-team-api
    runtime: python
    rootDir: server
    plan: starter
    buildCommand: ""
    startCommand: python server.py
    disk:
      name: tonicao-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TONICAO_DB
        value: /var/data/tonicao_sync.sqlite3
      - key: TONICAO_BOOTSTRAP_SECRET
        generateValue: true
      - key: TONICAO_ALLOWED_ORIGINS
        value: https://jiomavj-tech.github.io
      - key: TONICAO_TIMEZONE
        value: America/Sao_Paulo
      - key: TONICAO_INVITE_TTL_HOURS
        value: "72"
