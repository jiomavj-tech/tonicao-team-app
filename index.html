         "Sem apagar nenhum dado."],
        ["Configurar academia: logo, nome, cor e história.",
         "A cara da sua equipe no app."],
        ["Auditoria: histórico de ações.",
         "Transparência e segurança."],
        ["Backup: exporte os dados com frequência.",
         "Proteção contra perda do aparelho."]
      ]
    }
  };

  const ROLE_LABEL = { admin: "Administrador/Dono", professor: "Professor", aluno: "Aluno" };
  const ORDER = ["home", "checkin", "students", "graduation", "more"];

  function table(role) { return role === "aluno" ? ALUNO : role === "professor" ? PROF : ADMIN; }

  function pick(role, key) {
    if (!role) return LOGIN;
    const own = table(role)[key];
    if (own) return own;
    if (role === "admin") {
      const p = PROF[key] || PROF[key.split(":")[0]];
      if (p) return { title: p.title, steps: [["Modo de manutenção", ADMIN_NOTE]].concat(p.steps) };
    }
    return table(role)[key.split(":")[0]] || LOGIN;
  }

  function currentKey() {
    let page = "home", mode = "menu";
    try { page = currentMainPage; } catch (e) {}
    try { mode = currentMoreMode; } catch (e) {}
    return page === "more" && mode && mode !== "menu" ? "more:" + mode : page;
  }

  async function currentRole() {
    try {
      if (document.body.classList.contains("auth-locked")) return null;
      const u = await TonicaoAuth.currentUser();
      return u && u.role ? u.role : null;
    } catch (e) { return null; }
  }

  /* ------------------------------------------------------------ interface */
  const css = `
  .hlp-btn{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;
    width:48px;height:48px;border-radius:50%;border:0;background:#2563EB;color:#fff;font-size:24px;font-weight:800;
    box-shadow:0 6px 20px rgba(37,99,235,.45);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .hlp-btn:active{transform:scale(.94)}
  body.auth-locked .hlp-btn{z-index:1050;bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  body.hlp-hidden .hlp-btn{display:none}
  .hlp-back{position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;padding:14px}
  .hlp-back.show{display:flex}
  .hlp-sheet{background:#fff;color:#111;border-radius:22px 22px 12px 12px;width:min(640px,100%);max-height:86vh;overflow:auto;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));font-size:15px;line-height:1.45}
  .hlp-role{display:inline-block;font-size:12px;font-weight:700;color:#2563EB;background:#EFF6FF;border-radius:999px;padding:3px 10px}
  .hlp-sheet h3{margin:10px 0 14px;font-size:20px}
  .hlp-step{display:flex;gap:12px;margin-bottom:14px}
  .hlp-n{flex:none;width:28px;height:28px;border-radius:50%;background:#2563EB;color:#fff;font-weight:800;font-size:14px;
    display:flex;align-items:center;justify-content:center}
  .hlp-what{font-weight:600}
  .hlp-why{color:#555;font-size:14px;margin-top:3px}
  .hlp-why b{color:#16A34A}
  .hlp-actions{display:flex;gap:10px;margin-top:8px;position:sticky;bottom:0;background:#fff;padding-top:8px}
  .hlp-actions button{flex:1;height:46px;border-radius:12px;border:0;font-weight:700;font-size:15px;cursor:pointer}
  .hlp-primary{background:#2563EB;color:#fff}
  .hlp-secondary{background:#F1F5F9;color:#111}
  .hlp-sec{border:1px solid #E5E7EB;border-radius:14px;margin-bottom:10px;overflow:hidden}
  .hlp-sec summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none}
  .hlp-sec summary::after{content:"＋";float:right;color:#2563EB}
  .hlp-sec[open] summary::after{content:"－"}
  .hlp-sec .hlp-body{padding:4px 14px 6px}
  .hlp-tip{font-size:13px;color:#555;background:#F8FAFC;border-radius:12px;padding:10px 12px;margin-bottom:14px}`;

  const style = document.createElement("style");
  style.textContent = css;
  document.head.appendChild(style);

  const btn = document.createElement("button");
  btn.className = "hlp-btn";
  btn.type = "button";
  btn.setAttribute("aria-label", "Ajuda desta tela");
  btn.textContent = "?";
  document.body.appendChild(btn);

  const back = document.createElement("div");
  back.className = "hlp-back";
  back.innerHTML = '<div class="hlp-sheet" role="dialog" aria-modal="true"></div>';
  document.body.appendChild(back);
  const sheet = back.firstChild;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function stepsHtml(steps) {
    return steps.map((s, i) =>
      '<div class="hlp-step"><div class="hlp-n">' + (i + 1) + '</div><div>' +
      '<div class="hlp-what">' + esc(s[0]) + '</div>' +
      '<div class="hlp-why"><b>Por quê:</b> ' + esc(s[1]) + '</div></div></div>'
    ).join("");
  }

  function close() { back.classList.remove("show"); }
  back.addEventListener("click", e => { if (e.target === back) close(); });

  async function openPage() {
    const role = await currentRole();
    const h = pick(role, currentKey());
    sheet.innerHTML =
      '<span class="hlp-role">' + esc(role ? ROLE_LABEL[role] || role : "Antes de entrar") + '</span>' +
      '<h3>' + esc(h.title) + '</h3>' + stepsHtml(h.steps) +
      '<div class="hlp-actions">' +
      (role ? '<button class="hlp-secondary" data-h="manual">Manual completo</button>' : "") +
      '<button class="hlp-primary" data-h="close">Entendi</button></div>';
    back.classList.add("show");
    sheet.scrollTop = 0;
  }

  async function openManual() {
    const role = await currentRole();
    if (!role) return openPage();
    const t = table(role);
    const keys = ORDER.filter(k => t[k] || role === "admin")
      .concat(Object.keys(t).filter(k => k.includes(":")));
    const seen = new Set();
    const secs = keys.filter(k => !seen.has(k) && seen.add(k)).map(k => {
      const h = pick(role, k);
      return '<details class="hlp-sec"><summary>' + esc(h.title) + '</summary><div class="hlp-body">' +
        stepsHtml(h.steps) + '</div></details>';
    }).join("");
    sheet.innerHTML =
      '<span class="hlp-role">' + esc(ROLE_LABEL[role] || role) + '</span>' +
      '<h3>Manual completo</h3>' +
      '<div class="hlp-tip">Toque em cada tema para abrir. Em qualquer tela, o botão <b>?</b> mostra só a ajuda daquela tela.</div>' +
      secs +
      '<div class="hlp-actions"><button class="hlp-secondary" data-h="page">Voltar</button>' +
      '<button class="hlp-primary" data-h="close">Fechar</button></div>';
    sheet.scrollTop = 0;
  }

  sheet.addEventListener("click", e => {
    const a = e.target.closest("[data-h]");
    if (!a) return;
    if (a.dataset.h === "close") close();
    else if (a.dataset.h === "manual") openManual();
    else if (a.dataset.h === "page") openPage();
  });
  btn.addEventListener("click", openPage);

  /* Primeira vez em cada perfil, neste aparelho: abre o passo a passo sozinho. */
  let lastRole = undefined;
  setInterval(async () => {
    const role = await currentRole();
    if (role === lastRole) return;
    lastRole = role;
    if (!role) return;
    let seen = "1";
    try { seen = localStorage.getItem("tonicao-help-seen-" + role); } catch (e) {}
    if (!seen) {
      try { localStorage.setItem("tonicao-help-seen-" + role, "1"); } catch (e) {}
      setTimeout(openPage, 600);
    }
  }, 1500);

  window.TonicaoHelp = { open: openPage, manual: openManual };
})();
</script>
<script>/* ===== v024-features.js ===== */
/* ===== v024-features.js ===== */
/* Tonicão Team v0.24

   Camada complementar: não altera o modelo de dados acadêmicos existente.
*/
(() => {
  "use strict";

  const V024 = {
    version: "v0.24",
    demoMessageKey: "tonicao_v024_demo_message",
    demoStudentKey: "tonicao_v024_demo_student",
    scheduled: false
  };

  const $ = (q, root=document) => root.querySelector(q);
  const esc024 = (v="") => String(v).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));

  function publicAppUrl(){
    try{
      if(typeof APP_CONFIG!=="undefined" && APP_CONFIG.publicAppUrl) return APP_CONFIG.publicAppUrl;
    }catch(_){}
    return location.origin + location.pathname.replace(/[^/]*$/,"");
  }

  async function academyName(){
    try{
      const s = await getSettings();
      return s?.academyName || s?.academy || "Tonicão Team";
    }catch(_){ return "Tonicão Team"; }
  }

  async function shareApplication(){
    const name = await academyName();
    const base = publicAppUrl();
    let url=base;
    try{const u=new URL(base,location.href);u.search="";u.searchParams.set("academy",window.TONICAO_ACADEMY_ID||"tonicao-sul-ilha");url=u.href}catch(_){}
    const data = {
      title: `${name} — aplicativo`,
      text: `Conheça o aplicativo da ${name}.`,
      url
    };
    if(navigator.share){
      try{
        await navigator.share(data);
        return;
      }catch(e){
        if(e?.name === "AbortError") return;
      }
    }
    try{
      await navigator.clipboard.writeText(url);
      toast("Link do aplicativo copiado.");
    }catch(_){
      prompt("Copie o link do aplicativo:", url);
    }
  }
  window.shareApplication = shareApplication;

  function injectStyles(){
    if($("#v024-styles")) return;
    const style=document.createElement("style");

      .v024-share-top{min-width:42px;height:42px;border:0;border-radius:12px;background:#1d4ed8;color:#fff;font-size:20px;font-weight:800;cursor:pointer;margin-left:8px}

    const subtitle=$("#topSubtitle");

    fix();
    new MutationObserver(fix).observe(subtitle,{childList:true,subtree:true,characterData:true});

      if(me?.role==="admin" && list && !host.querySelector("[data-v024-present]")){

      host.querySelectorAll(".section-title h2").forEach(h=>{
        if(h.textContent.trim()==="Usuários do servidor") h.textContent="Contas no servidor — avançado";

  async function unifiedUserModal(){

      ${remoteReady
        ? `<button class="btn primary full" onclick="saveUnifiedUser(false)">Criar usuário completo</button><p class="small muted" style="margin-top:8px">${fb?"A conta é criada uma única vez no Firebase e funciona nos outros aparelhos.":"Uma única ação cria a conta local + remota."}</p>`
        : fb
          ? `<button class="btn primary full" onclick="goToCloudFromUnified()">Entrar como Administrador/Dono</button>
             <p class="small muted" style="margin-top:8px">Com Firebase não criamos uma segunda conta apenas neste aparelho. Conecte o Dono e faça um único cadastro.</p>`
          : `<button class="btn primary full" onclick="goToCloudFromUnified()">Conectar ao servidor</button>
             <button class="btn secondary full" style="margin-top:8px" onclick="saveUnifiedUser(true)">Criar somente neste aparelho</button>`
      }`);
  }

  async function saveUnifiedUser(localOnly=false){
    try{
      const name=$("#usrName")?.value.trim()||"";
      const username=$("#usrUsername")?.value.trim()||"";
      const password=$("#usrPass")?.value||"";
      const role=$("#usrRole")?.value||"professor";
      const studentId=$("#usrStudent")?.value||"";
      if(!name) throw new Error("Informe o nome.");
      if(!username) throw new Error(window.TonicaoFirebase?.configured?"Informe o e-mail.":"Informe o usuário.");
      const fbMode=!!window.TonicaoFirebase?.configured;
      if(localOnly&&fbMode)throw new Error("Com Firebase, conecte o Administrador e crie uma única conta completa.");
      if(fbMode&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(username)) throw new Error("Digite um e-mail válido.");
      {const prob=TonicaoAuth.passwordProblem?TonicaoAuth.passwordProblem(password):"";if(prob)throw new Error(prob)}
      if(role==="aluno" && !studentId) throw new Error("Selecione o aluno vinculado.");

      const locals=await (TonicaoAuth.allUsers?TonicaoAuth.allUsers():TonicaoAuth.users());
      const localExisting=(locals||[]).find(u=>String(u.username||"").toLowerCase()===username.toLowerCase());
      if(localExisting && (localExisting.role!==role || String(localExisting.studentId||"")!==String(studentId||""))){
        throw new Error("Já existe uma conta local com esse usuário e outro perfil/vínculo.");
      }

      let remoteExisting=null;
      if(!localOnly){
        const settings=await getSettings();
        if(!settings.cloudSessionToken || !settings.remoteUser || !navigator.onLine){
          throw new Error("Conecte o Administrador ao servidor antes de criar a conta completa.");
        }
        const remoteList=await TonicaoRemoteAuth.listRemoteUsers();
        remoteExisting=(remoteList?.users||[]).find(u=>String(u.username||"").toLowerCase()===username.toLowerCase());
        if(remoteExisting && (remoteExisting.role!==role || String(remoteExisting.studentId||"")!==String(studentId||""))){
          throw new Error("Já existe uma conta remota com esse usuário e outro perfil/vínculo.");
        }
        if(!remoteExisting){
          await TonicaoRemoteAuth.createRemoteUser({name,username,password,role,studentId});
        }
      }

      if(!localExisting && !fbMode){ // com Firebase, a conta vale na nuvem; não precisa cópia local
        await TonicaoAuth.createUser({name,username,password,role,studentId});
      }

      closeModal();
      toast(localOnly
        ? "Conta criada neste aparelho. Falta a conta do servidor para uso em outros dispositivos."
        : (fbMode?"Conta criada. A pessoa já pode entrar com esse e-mail e senha.":"Usuário criado no aparelho e no servidor."));
      await renderMore("users");
    }catch(e){
      toast(e.message||"Falha ao criar usuário.");
    }
  }
  window.saveUnifiedUser=saveUnifiedUser;

  async function goToCloudFromUnified(){

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init,{once:true});
  else init();
})();
</script>
<script>/* ===== demo-mode.js ===== */
/* ===== demo-mode.js ===== */
/* v0.26 — Modo Apresentação completo.
   Abre o app inteiro (todas as telas e funções) num banco separado, só com dados fictícios,
   sem Firebase e sem tocar nos dados reais. Endereço: ...?demo=1 */
(()=>{
  "use strict";
  const DEMO=!!window.TONICAO_DEMO;
  const BASE=location.origin+location.pathname;
  const PASS="Demo@2026!";
  const ACCOUNTS={
    admin:{username:"dono.demo",name:"Dono (demonstração)",label:"🛡️ Dono"},
    professor:{username:"professor.demo",name:"Professor Demo",label:"🥋 Professor"},

    window.openPresentation=function(){const u=new URL(BASE);u.searchParams.set("academy",window.TONICAO_ACADEMY_ID||"tonicao-sul-ilha");u.searchParams.set("demo","1");location.href=u.href};
    const fixText=()=>{document.querySelectorAll("[data-v024-present] .small").forEach(el=>{if(!el.dataset.v026){el.dataset.v026="1";el.textContent="Abre o app completo com dados fictícios: Dono, Professor e Aluno. Seus dados reais não são tocados."}})};
    new MutationObserver(fixText).observe(document.documentElement,{childList:true,subtree:true});
    return;
  }

  const css=`
    body{padding-top:52px!important}
    .topbar{top:52px!important}
    #demoBar{position:fixed;top:0;left:0;right:0;z-index:1500;background:#b45309;color:#fff;display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top,0px));font:600 13px system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25);overflow-x:auto}
    #demoBar .t{white-space:nowrap;margin-right:4px}
    #demoBar button{border:0;border-radius:999px;padding:8px 11px;font:700 13px system-ui,sans-serif;background:rgba(255,255,255,.2);color:#fff;white-space:nowrap;cursor:pointer}
    #demoBar button.on{background:#fff;color:#b45309}
    #demoBar .sp{flex:1}
    .v024-demo-close,#v024Presentation{display:none!important}`;
  function bar(role){
    let b=document.getElementById("demoBar");
    if(!b){
      const st=document.createElement("style");st.textContent=css;document.head.appendChild(st);
      b=document.createElement("div");b.id="demoBar";document.body.appendChild(b);
    }
    b.innerHTML=`<span class="t">🎬 Apresentação</span>`+
      Object.entries(ACCOUNTS).map(([r,a])=>`<button class="${r===role?"on":""}" onclick="demoSwitch('${r}')">${a.label}</button>`).join("")+
      `<span class="sp"></span><button onclick="demoMenu()">⋯</button>`;
  }
  async function ensureAccounts(){
    if(!(await TonicaoAuth.hasOwner())){
      await TonicaoAuth.bootstrapAdmin({name:ACCOUNTS.admin.name,username:ACCOUNTS.admin.username,password:PASS});
    }
    await TonicaoAuth.login(ACCOUNTS.admin.username,PASS);
    if(!(await DB.getOne("classSessions","cls-demo-diario"))){ // diário e histórico fictícios (v0.31)
      const d=n=>{const x=new Date();x.setDate(x.getDate()-n);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`};
      const techs=(await DB.getAll("techniques")).slice(0,2).map(t=>t.id);
      await DB.rawPut("classSessions",{id:"cls-demo-diario",title:"Adulto • 19:00",date:d(1),startTime:"19:00",createdAt:new Date(Date.now()-86400000).toISOString(),expiresAt:new Date(Date.now()-86400000+5400000).toISOString(),status:"closed",lesson:{topic:"Passagem de guarda e controle lateral",techniqueIds:techs,notes:"3 rounds de 5 min com foco em manter o controle lateral.",updatedAt:new Date().toISOString(),by:"Professor Demo"}});
      await DB.rawPut("classSessions",{id:"cls-demo-diario2",title:"Adulto • 19:00",date:d(3),startTime:"19:00",createdAt:new Date(Date.now()-3*86400000).toISOString(),expiresAt:new Date(Date.now()-3*86400000+5400000).toISOString(),status:"closed"});
      for(const [sid,sess,dt] of [["s2","cls-demo-diario",d(1)],["s1","cls-demo-diario",d(1)],["s3","cls-demo-diario2",d(3)],["s4","cls-demo-antigo",d(20)]])
        await DB.rawPut("attendance",{id:`${sess}_${sid}`,studentId:sid,sessionId:sess,date:dt,time:"19:05",source:"qr-codigo",status:"approved"});
      for(const [i,sid] of ["s1","s2","s3","s4"].entries()){const st=await DB.getOne("students",sid);if(st&&!st.phone){st.phone="4899990000"+(i+1);await DB.rawPut("students",st)}}
      const s1=await DB.getOne("students","s1");if(s1){s1.classesInBelt=Math.max(s1.classesInBelt||0,s1.targetClasses||120);await DB.rawPut("students",s1)}
    }
    if(!(await DB.getAll("classSchedule")).length){ // grade fictícia para a apresentação
      for(const x of [{id:"sch-demo-adulto",name:"Adulto",days:[1,3,5],start:"19:00",duration:90,track:"adulto"},{id:"sch-demo-kids",name:"Kids",days:[2,4],start:"18:00",duration:60,track:"kids"},{id:"sch-demo-sabado",name:"Treino livre",days:[6],start:"10:00",duration:120,track:"todos"},{id:"sch-demo-hoje",name:"Aula de hoje",days:[new Date().getDay()],start:"20:00",duration:90,track:"todos"}])
        await DB.rawPut("classSchedule",{...x,active:true});
    }
    const all=await (TonicaoAuth.allUsers?TonicaoAuth.allUsers():TonicaoAuth.users());
    for(const r of ["professor","aluno"]){
      const a=ACCOUNTS[r];
      if(!all.some(u=>u.username===a.username))await TonicaoAuth.createUser({name:a.name,username:a.username,password:PASS,role:r,studentId:a.studentId||""});
    }
  }
  async function switchTo(role){
    const a=ACCOUNTS[role];
    try{await TonicaoAuth.logout()}catch(e){}
    await TonicaoAuth.login(a.username,PASS);

    toast(`Agora você está vendo o app como ${a.label.replace(/^\S+\s/,"")}.`);
  }
  window.demoSwitch=r=>switchTo(r).catch(e=>toast(e.message||"Falha ao trocar."));
  // ---- v0.30: na apresentação nada sai do app (WhatsApp, servidor) e tudo pode ser simulado ----
  let lastWhats="";

    const u=String(url||"");

    window.__demoKeepWhats=true;

      <p class="small muted">No uso real, o aluno recebe esta mensagem no WhatsApp, abre o link e preenche os próprios dados:</p>

  };
  window.demoCompleteRegistration=async function(id){
    const r=await DB.getOne("registrationRequests",id);if(!r)return;

      emergencyName:r.emergencyName||"Contato de emergência",emergencyPhone:r.emergencyPhone||"48999990000",privacyConsentAt:new Date().toISOString(),completedAt:new Date().toISOString()});
    await DB.put("registrationRequests",r);
    closeModal();toast("Cadastro preenchido. Agora o Professor confirma na aba Alunos.");
    await renderAll();try{goPage("students")}catch(e){}
  };
  // contas "no servidor" viram contas locais da apresentação
  try{
    TonicaoRemoteAuth.createRemoteUser=async({name,username,password,role,studentId=""})=>{await TonicaoAuth.createUser({name,username,password,role,studentId});return {user:{id:username}}};
    TonicaoRemoteAuth.listRemoteUsers=async()=>({users:(await (TonicaoAuth.allUsers?TonicaoAuth.allUsers():TonicaoAuth.users())).map(u=>({id:u.id,name:u.name,email:u.username,username:u.username,role:u.role,studentId:u.studentId||"",active:u.active!==false,provider:"password"}))});
  }catch(e){}

  window.demoMenu=function(){
    showModal(`<h3>🎬 Modo Apresentação</h3>
      <p class="small muted">Tudo aqui é fictício e fica separado dos dados reais da academia. Pode apertar todos os botões à vontade.</p>
      <div class="notice"><strong>Roteiro sugerido</strong><div class="small">
        1. <b>Professor</b>: abra uma aula (Check-in) e mostre o QR e o código.<br>
        2. <b>Aluno</b>: faça o check-in com o código e veja pontos e ranking.<br>
        3. <b>Professor</b>: graduação, eventos, técnicas, relatórios.<br>
        4. <b>Dono</b>: usuários, conteúdo da academia e acesso do sistema.</div></div>
      <button class="btn secondary full" style="margin-top:12px" onclick="demoReset()">🔄 Recomeçar apresentação do zero</button>
      <button class="btn primary full" style="margin-top:8px" onclick="demoExit()">✅ Sair da apresentação</button>`);
  };
  window.demoReset=function(){
    if(!confirm("Apagar tudo o que foi feito na apresentação e começar de novo?"))return;
    sessionStorage.removeItem("tonicaoDemoRole");
    const req=indexedDB.deleteDatabase("tonicao_demo");
    req.onsuccess=req.onerror=req.onblocked=()=>location.reload();
    setTimeout(()=>location.reload(),1500);
  };
  window.demoExit=function(){location.href=BASE};

  async function start(){
    // espera o app terminar de preparar o banco de demonstração
    for(let i=0;i<60;i++){
      try{if((await DB.getAll("gradingPlans")).length)break}catch(e){}
      await new Promise(r=>setTimeout(r,150));
    }
    try{
      await ensureAccounts();
      const role=sessionStorage.getItem("tonicaoDemoRole")||"professor";
      await switchTo(role);
    }catch(e){console.warn("Demo",e);toast("Não foi possível abrir a apresentação: "+(e.message||e))}
  }
  window.addEventListener("load",()=>setTimeout(start,300));
})();
</script>
</body>
</html>
