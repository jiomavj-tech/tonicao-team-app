<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Tonicão Team Sul da Ilha</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./assets/icon-512.png">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="manifest" href="./manifest.json">
  <style>
:root{
  --bg:#f4f5f7;
  --card:#ffffff;
  --ink:#151515;
  --muted:#70737a;
  --line:#e4e6ea;
  --dark:#111213;
  --accent:#2563eb;
  --accent-2:#0f3fa9;
  --green:#16a34a;
  --amber:#d97706;
  --red:#dc2626;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app-shell{max-width:780px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:92px}
.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--dark);color:#fff;padding:18px 18px 14px;
  display:flex;align-items:center;gap:12px;box-shadow:0 5px 15px rgba(0,0,0,.16)
}
.brand-logo{width:48px;height:48px;border-radius:12px;object-fit:cover;background:#000}
.brand h1{margin:0;font-size:19px;line-height:1.15}
.brand p{margin:3px 0 0;color:#c8c8c8;font-size:12px}
.spacer{flex:1}
.role-toggle{background:#26282b;border:1px solid #3a3d42;color:white;border-radius:12px;padding:8px 10px}
.page{display:none;padding:18px}
.page.active{display:block}
.hero{
  background:linear-gradient(145deg,#101112,#25272b);
  color:white;border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px
}
.hero-row{display:flex;align-items:center;gap:14px}
.avatar{width:66px;height:66px;border-radius:50%;background:#d1d5db;object-fit:cover;border:3px solid #fff}
.hero h2{margin:0 0 4px;font-size:22px}
.hero p{margin:0;color:#d7d7d7}
.belt{margin-top:16px;border-radius:12px;background:#1e40af;padding:11px 14px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)
}
.card h3{margin:0 0 8px;font-size:16px}
.kpi{font-size:30px;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:13px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 12px}
.section-title h2{font-size:19px;margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}
.pill.green{background:#dcfce7;color:#166534}
.pill.amber{background:#ffedd5;color:#9a3412}
.pill.red{background:#fee2e2;color:#991b1b}
.list{display:flex;flex-direction:column;gap:10px}
.list-item{
  display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.05)
}
.list-item strong{display:block}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#f1f5f9;font-size:20px;flex:0 0 auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:700}
.btn.primary{background:var(--accent);color:white}
.btn.secondary{background:#eef2f6;color:#222}
.btn.danger{background:#fee2e2;color:#991b1b}
.btn.green{background:#dcfce7;color:#166534}
.btn.full{width:100%;padding:14px}
.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:999px}
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:50;
  width:min(780px,100%);background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px 10px;box-shadow:0 -10px 30px rgba(0,0,0,.08)
}
.nav button{border:0;background:transparent;color:#777;padding:6px 3px;font-size:11px}
.nav button.active{color:var(--accent);font-weight:800}
.nav .nav-ico{display:block;font-size:21px;margin-bottom:2px}
.notice{
  border-left:4px solid var(--accent);padding:12px 14px;background:#eff6ff;border-radius:12px;margin-bottom:10px
}
.notice.birthday{border-color:#db2777;background:#fdf2f8}
.notice.payment{border-color:var(--amber);background:#fff7ed}
.notice.grade{border-color:var(--green);background:#f0fdf4}
.student-row{display:flex;align-items:center;gap:12px}
.student-row img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#ddd}
.student-row .meta{flex:1}
.rank{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px}
.rank .pos{font-weight:900;font-size:20px;text-align:center}
.tabs{display:flex;gap:6px;padding:4px;background:#e5e7eb;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;border:0;border-radius:10px;padding:9px;background:transparent;font-weight:700;color:#6b7280}
.tabs button.active{background:#fff;color:#111;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.field{margin:10px 0}
.field label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:11px;background:#fff}
.field textarea{min-height:84px;resize:vertical}
.checklist{display:flex;flex-direction:column;gap:8px}
.check-item{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.check-item input{margin-top:4px}
.history-line{position:relative;padding-left:28px}
.history-line:before{content:"";position:absolute;left:8px;top:5px;bottom:-10px;width:2px;background:#d1d5db}
.history-line:after{content:"";position:absolute;left:2px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.modal-backdrop{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;padding:18px;align-items:flex-end;justify-content:center
}
.modal-backdrop.show{display:flex}
.modal{background:white;border-radius:22px 22px 10px 10px;padding:18px;width:min(720px,100%);max-height:86vh;overflow:auto}
.modal h3{margin-top:0}
.toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%);
  z-index:200;background:#111;color:#fff;padding:10px 14px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.2s
}
.toast.show{opacity:1}
.logo-history{width:100%;max-height:220px;object-fit:contain;background:#000;border-radius:16px;margin-bottom:14px}
.exam-title{font-weight:900;font-size:22px}
.empty{padding:20px;text-align:center;color:#777}
@media (max-width:520px){
  .grid{grid-template-columns:1fr 1fr}
  .page{padding:14px}
  .topbar{padding-left:14px;padding-right:14px}
  .brand h1{font-size:16px}
  .brand-logo{width:42px;height:42px}
}

.session-card{
  border:2px solid #bbf7d0;
  background:linear-gradient(180deg,#ffffff,#f0fdf4);
}
.session-code{
  font-size:42px;
  font-weight:900;
  letter-spacing:8px;
  text-align:center;
  padding:16px 8px;
  border-radius:16px;
  background:#111;
  color:#fff;
  margin:12px 0;
}
.list-item select{
  max-width:190px;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:8px;
  background:#fff;
}
@media(max-width:520px){
  .session-code{font-size:36px;letter-spacing:6px}
  .list-item select{max-width:145px}
}

.small-avatar{width:46px!important;height:46px!important;border:0!important;display:grid!important;place-items:center!important;background:#e5e7eb!important}
.qr-host{display:flex;justify-content:center;padding:12px 0}
.qr-canvas{width:min(280px,82vw);height:auto;border-radius:12px;border:8px solid #fff;box-shadow:0 4px 18px rgba(0,0,0,.12);image-rendering:pixelated}
.qr-video{width:100%;max-height:58vh;object-fit:cover;border-radius:16px;background:#111}
.crop-canvas{display:block;width:min(320px,100%);height:auto;margin:10px auto;border-radius:18px;background:#ddd}
.tech-link{margin-top:7px;padding:7px 9px;border-radius:10px;background:#f8fafc;font-size:12px}
.mini-btn{border:0;background:#eef2ff;color:#3730a3;border-radius:8px;padding:5px 8px;font-weight:700;margin-top:6px;cursor:pointer}
.notice.grading{border-color:var(--green);background:#f0fdf4}


.qr-box{
  min-height:240px;
  display:grid;
  place-items:center;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:10px;
  margin:10px 0 14px;
}
.qr-box img,.qr-box canvas{max-width:220px!important;height:auto!important}
textarea[readonly]{background:#f8fafc;font-size:11px;word-break:break-all}


.timer-display{
  background:#111;color:#fff;border-radius:22px;padding:26px 18px;text-align:center;margin-bottom:14px;
  box-shadow:var(--shadow)
}
.timer-phase{font-size:18px;text-transform:uppercase;letter-spacing:.14em;color:#cbd5e1;font-weight:800}
.timer-time{font-size:72px;line-height:1;font-weight:900;margin:12px 0}
.timer-round{font-size:18px;color:#e5e7eb;font-weight:700}
.timer-rest .timer-display{background:#1f2937}
@media(max-width:520px){.timer-time{font-size:58px}}

.cloud-status{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;
  margin-bottom:14px;box-shadow:var(--shadow)
}
.cloud-status.online{border-left:4px solid #16a34a}
.cloud-status.offline{border-left:4px solid #94a3b8}
.cloud-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.cloud-row:last-child{border-bottom:0}
.cloud-row span{color:var(--muted)}
.cloud-row strong{text-align:right}


.auth-gate{
  display:none;position:fixed;inset:0;z-index:1000;background:#0f1115;
  align-items:flex-start;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px))
}
.auth-card{margin:auto 0}
.auth-gate.show{display:flex}
.auth-card{
  width:min(460px,100%);background:#fff;border-radius:24px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.35)
}
.auth-logo{width:110px;height:110px;object-fit:contain;background:#000;border-radius:22px;display:block;margin:0 auto 18px}
.auth-card h2{text-align:center;margin:0 0 8px}
.auth-card>div>p{text-align:center}
.auth-locked .app-shell,.auth-locked .nav{filter:blur(5px);pointer-events:none;user-select:none}


.top-back{
  display:none;width:42px;height:42px;border:0;border-radius:12px;
  background:#292b2f;color:#fff;font-size:22px;font-weight:900;
  place-items:center;flex:0 0 auto
}
.top-back.show{display:grid}
.modal-back-btn{
  border:0;background:#eef2f6;color:#222;border-radius:12px;
  padding:9px 12px;font-weight:800;margin-bottom:14px
}
.history-text{white-space:pre-line;line-height:1.6;color:#2b2d31}
.admin-logo-preview{
  width:120px;height:120px;object-fit:contain;background:#111;
  border-radius:18px;display:block;margin:0 auto 16px
}
.tall-textarea{min-height:180px!important}

.timeline{display:flex;flex-direction:column;gap:0}
.timeline-item{display:grid;grid-template-columns:24px 1fr;gap:10px;position:relative}
.timeline-item:before{content:"";position:absolute;left:10px;top:18px;bottom:-10px;width:2px;background:#d1d5db}
.timeline-item:last-child:before{display:none}
.timeline-dot{width:14px;height:14px;border-radius:50%;background:var(--accent);margin:16px 0 0 4px;z-index:1}
.timeline-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.timeline-year{display:inline-block;font-size:12px;font-weight:900;color:var(--accent);margin-bottom:4px}
.gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gallery-item{margin:0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gallery-item img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gallery-item figcaption{padding:9px;font-size:12px;color:#555}
.admin-gallery{margin-top:12px}
.report-table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}
.report-table{border-collapse:collapse;width:100%;min-width:640px}
.report-table th,.report-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
.report-table th{background:#f8fafc;position:sticky;top:0}
@media(max-width:520px){.gallery-grid{grid-template-columns:1fr 1fr}}

.dashboard-hero{margin-bottom:12px}
.dashboard-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.dashboard-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.dash-kpi{text-align:center;padding:14px 8px}
.dash-kpi span,.dash-kpi small{display:block;color:var(--muted);font-size:12px}
.dash-kpi strong{display:block;font-size:28px;line-height:1.1;margin:5px 0}
.attention-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.attention-card{text-align:center;cursor:pointer;padding:13px 8px}
.attention-card strong{display:block;font-size:22px}
.attention-card span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.attention-icon{font-size:22px;margin-bottom:5px}
@media(max-width:600px){
  .dashboard-kpis{grid-template-columns:repeat(2,1fr)}
  .attention-grid{grid-template-columns:repeat(2,1fr)}
}

.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:#94a3b8;font-size:12px}
.auth-divider:before,.auth-divider:after{content:"";height:1px;background:#e5e7eb;flex:1}
.google-login-area{min-height:44px;display:grid;place-items:center}
.google-fallback{
  width:100%;min-height:44px;border:1px solid #dadce0;border-radius:8px;background:#fff;
  font-size:14px;font-weight:600;color:#3c4043;display:flex;align-items:center;justify-content:center;gap:12px
}
.google-g{font-size:20px;font-weight:900;color:#4285f4}
.google-help{text-align:center;margin-top:6px}
.google-pending-card{margin-bottom:10px}
.google-profile-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.google-profile-photo{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.google-placeholder{display:grid;place-items:center;background:#f1f5f9;font-weight:900;color:#4285f4}

.subsection-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;color:var(--muted);margin:16px 0 8px}

.plan-card.blue{border-left:6px solid #2563eb}.plan-card.purple{border-left:6px solid #7c3aed}.plan-card.brown{border-left:6px solid #92400e}.plan-card.dark{border-left:6px solid #111827}
.pill.blue{background:#dbeafe;color:#1d4ed8}.pill.purple{background:#ede9fe;color:#6d28d9}.pill.brown{background:#f3e8d7;color:#92400e}.pill.dark{background:#e5e7eb;color:#111827}

.plan-card.gray{border-left:6px solid #6b7280}.plan-card.yellow{border-left:6px solid #eab308}.plan-card.orange{border-left:6px solid #f97316}.plan-card.green{border-left:6px solid #16a34a}
.pill.gray{background:#f3f4f6;color:#4b5563}.pill.yellow{background:#fef9c3;color:#854d0e}.pill.orange{background:#ffedd5;color:#9a3412}

.exam-workflow-card{border-left:5px solid var(--accent)}
.evaluation-list{display:flex;flex-direction:column;gap:8px}.evaluation-item{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}.evaluation-item select{margin:0}.pill.blue{background:#dbeafe;color:#1d4ed8}@media(max-width:520px){.evaluation-item{grid-template-columns:1fr}.evaluation-item select{width:100%}}

.academy-block-gate{display:none;position:fixed;inset:0;z-index:1100;background:#111827;align-items:center;justify-content:center;padding:22px}
.academy-block-gate.show{display:flex}.academy-block-card{width:min(460px,100%);background:#fff;border-radius:24px;padding:28px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.block-icon{font-size:48px;margin-bottom:10px}.academy-locked .app-shell,.academy-locked .nav{filter:blur(5px);pointer-events:none}
.owner-mode{border-left:5px solid #7c3aed}.request-card{border-left:5px solid #f59e0b}

.notification-status-card{display:flex;flex-direction:column;gap:12px}
.notification-row.unread{border-left:5px solid var(--accent);background:#f8fbff}
.unread-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:0 0 auto}

.score-base-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.score-base{background:#111827;color:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:5px}
.score-base span{font-size:24px;font-weight:900}
.score-rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.score-rule-card{border-top:5px solid var(--accent)}
.score-rule-card h3{margin-top:0}.score-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.score-columns>div{display:flex;flex-direction:column;gap:5px}.score-columns strong{margin-bottom:4px}.score-participation{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.rules-intro{border-left:5px solid var(--accent)}
.rules-list{display:flex;flex-direction:column;gap:8px;padding-left:28px}
.rules-list li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 8px}
.rules-list li span{display:inline-block;max-width:calc(100% - 60px)}
.reference-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.reference-card{margin:0;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.reference-card img{width:100%;height:280px;object-fit:cover;display:block}
.reference-card.wide img{height:auto;max-height:700px;object-fit:contain;background:#f4f4f5}
.reference-card figcaption{padding:12px;display:flex;flex-direction:column;gap:5px}
@media(max-width:520px){.score-base-grid,.score-columns{grid-template-columns:1fr}.reference-card img{height:240px}}

.contact-import-box{margin-bottom:14px;padding:12px;border:1px dashed var(--line);border-radius:14px;background:#f8fafc}
.contact-import-box p{margin:8px 2px 0}

.ready-approval{border-left:6px solid #16a34a}
.request-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.auth-card .field{ text-align:left }

/* v0.25.1: janelas e avisos sempre acima da tela de entrada */
.modal-backdrop{z-index:2000!important}
.toast{z-index:3000!important}

</style>

</head>
<body>
  <div id="authGate" class="auth-gate">
    <div class="auth-card">
      <img src="./assets/logo-tonicao.jpg" alt="Logo" class="auth-logo">
      <div id="authGateContent"></div>
    </div>
  </div>
  <div id="academyBlockGate" class="academy-block-gate">
    <div class="academy-block-card" id="academyBlockContent"></div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="app-shell">
    <header class="topbar">
      <button id="globalBackBtn" class="top-back" onclick="appBack()" aria-label="Voltar" title="Voltar">←</button>
      <img class="brand-logo" src="./assets/logo-tonicao.jpg" alt="Tonicão Team">
      <div class="brand">
        <h1>Tonicão Team Sul da Ilha</h1>
        <p id="topSubtitle">Piloto offline-first • v0.42</p>
      </div>
      <div class="spacer"></div>
      <button id="accountBtn" onclick="accountMenu()" aria-label="Minha conta" title="Minha conta"
        style="display:none;border:0;background:rgba(255,255,255,.15);color:inherit;border-radius:999px;width:40px;height:40px;font-size:20px;cursor:pointer;flex:0 0 auto">👤</button>
      <select id="roleSelect" class="role-toggle" aria-label="Perfil" style="display:none">
        <option value="professor">Professor</option>
        <option value="aluno">Aluno</option>
      </select>
    </header>

    <main>
      <section id="home" class="page active"></section>
      <section id="checkin" class="page"></section>
      <section id="students" class="page"></section>

<script>/* ===== qrcode-adapter.js ===== */
/* v0.25: adaptador — a biblioteca em vendor/ expõe QRCodeMatrix; o app usa new QRCode(el,{text,width,height}) */
(function(){
  if(window.QRCode||!window.QRCodeMatrix)return;
  var L=window.QRErrorCorrectLevel||{L:1,M:0,Q:3,H:2};
  function build(text,level){
    var last;
    for(var t=1;t<=40;t++){
      try{var q=new window.QRCodeMatrix(t,level);q.addData(String(text));q.make();return q}catch(e){last=e}
    }
    throw last||new Error("Texto grande demais para QR");
  }
  function QRCode(el,opts){
    opts=opts||{};
    var q=build(opts.text||"",opts.correctLevel!=null?opts.correctLevel:L.M);
    var n=q.getModuleCount(),size=opts.width||220,quiet=2,total=n+quiet*2,path="";
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))path+="M"+(c+quiet)+","+(r+quiet)+"h1v1h-1z";
    el.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+total+' '+total+'" width="'+size+'" height="'+size+'" shape-rendering="crispEdges" style="background:#fff;max-width:100%;height:auto"><path d="'+path+'" fill="#000"/></svg>';
  }
  QRCode.CorrectLevel=L;
  window.QRCode=QRCode;
})();
</script>

<script>/* ===== db.js ===== */
/* ===== db.js ===== */
const __TENANT_DB_SUFFIX=String(window.TONICAO_ACADEMY_ID||"tonicao-sul-ilha").replace(/[^a-z0-9_-]/g,"-");
const DB_NAME=window.TONICAO_DEMO
  ? (__TENANT_DB_SUFFIX==="tonicao-sul-ilha" ? "tonicao_demo" : "tonicao_demo_"+__TENANT_DB_SUFFIX)
  : (__TENANT_DB_SUFFIX==="tonicao-sul-ilha" ? "tonicao_app" : "tonicao_app_"+__TENANT_DB_SUFFIX); // v0.27: um IndexedDB por academia

/* v0.21 — Proteção contra injeção de HTML/JS.
   Todo texto gravado no banco passa por cleanValue():
   - campos de texto: < > removidos; aspas " ' ` trocadas por tipográficas (” ’ ´)
   - campos técnicos (id, url, token, hash, foto, data:/http...): só remove < > " ' `
   Assim nomes e observações digitados pelo aluno nunca viram código na tela do Professor. */
const TECH_KEY=/(^id$|id$|Id$|url$|Url$|URL$|token$|Token$|hash$|Hash$|salt$|Salt$|secret$|Secret$|credential$|endpoint$|Endpoint$|photo$|Photo$|picture$|src$|logo$|Logo$|image$|Image$|pdf$|Pdf$|dataUrl$|DataUrl$|username$|email$|Email$|sub$|Sub$|code$)/;
function cleanString(str,key=""){
  const v=String(str);
  if(TECH_KEY.test(key)||/^(data:|https?:|blob:)/i.test(v)) return v.replace(/[<>"'`]/g,"");
  return v.replace(/[<>]/g,"").replace(/"/g,"”").replace(/'/g,"’").replace(/`/g,"´");
}
function cleanValue(value,key=""){
  if(typeof value==="string") return cleanString(value,key);
  if(Array.isArray(value)) return value.map(v=>cleanValue(v,key));
  if(value && typeof value==="object" && Object.getPrototypeOf(value)===Object.prototype){
    const out={};
    for(const [k,v] of Object.entries(value)) out[k]=cleanValue(v,k);
    return out;
  }
  return value; // Blob, Date, números etc. ficam como estão
}
const DB_VERSION = 14; // v0.28: grade de horários e reservas

const STORE_DEFS = [
  ["students","id"], ["classSessions","id"], ["attendance","id"],
  ["gradingHistory","id"], ["gradingPlans","id"], ["gradingAssignments","id"],
  ["gradingReminders","id"], ["pointsLedger","id"], ["events","id"],
  ["techniques","id"], ["notifications","id"], ["paymentStatus","id"],
  ["documents","id"], ["settings","id"], ["academies","id"], ["devices","id"],
  ["invites","id"], ["syncLog","id"], ["academyContent","id"], ["timerPresets","id"],
  ["sequenceRules","id"], ["syncQueue","id"], ["syncMeta","id"], ["users","id"], ["authSession","id"], ["auditLog","id"], ["academyTimeline","id"], ["academyGallery","id"], ["reportPresets","id"], ["remoteAuth","id"], ["registrationRequests","id"], ["academyRules","id"], ["scoreRules","id"], ["referenceMaterials","id"], ["classSchedule","id"], ["classBookings","id"]
];

const SYNCABLE_STORES = new Set([
  "students","classSessions","attendance","gradingHistory","gradingPlans",
  "gradingAssignments","gradingReminders","pointsLedger","events","techniques",
  "notifications","paymentStatus","academyContent","timerPresets","sequenceRules","users","auditLog","academyTimeline","academyGallery","registrationRequests","academyRules","scoreRules","referenceMaterials","classSchedule","classBookings"
]);

let __dbPromise=null;
function openDB(){
  if(__dbPromise) return __dbPromise;
  __dbPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      STORE_DEFS.forEach(([name,keyPath])=>{
        if(!db.objectStoreNames.contains(name)) db.createObjectStore(name,{keyPath});
      });
    };
    req.onsuccess=()=>{const db=req.result;db.onversionchange=()=>{db.close();__dbPromise=null};resolve(db)};
    req.onerror=()=>{__dbPromise=null;reject(req.error)};
  });
  return __dbPromise;
}

async function rawPut(storeName,value){
  value=cleanValue(value);
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,"readwrite");
    tx.objectStore(storeName).put(value);
    tx.oncomplete=()=>resolve(value);
    tx.onerror=()=>reject(tx.error);
  });
}

async function rawDelete(storeName,id){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,"readwrite");
    tx.objectStore(storeName).delete(id);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}

async function getAll(storeName){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,"readonly");
    const req=tx.objectStore(storeName).getAll();
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=()=>reject(req.error);
  });
}

async function getOne(storeName,id){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,"readonly");
    const req=tx.objectStore(storeName).get(id);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  });
}

function changeId(){
  return globalThis.crypto?.randomUUID ? crypto.randomUUID() :
    "chg-"+Date.now()+"-"+Math.random().toString(36).slice(2,10);
}

async function queueChange(storeName,op,recordId,value,updatedAt){
  if(!SYNCABLE_STORES.has(storeName) || window.__TONICAO_REMOTE_APPLY__) return;
  // id determinístico: a alteração mais recente do mesmo registro substitui a anterior
  const item={
    id:`q:${storeName}:${String(recordId)}`,
    store:storeName,
    op,
    recordId:String(recordId),
    value:op==="put"?value:null,
    updatedAt:updatedAt||new Date().toISOString(),
    queuedAt:new Date().toISOString()
  };
  await rawPut("syncQueue",item);
  try{window.dispatchEvent(new CustomEvent("tonicao:queue-change",{detail:item}))}catch(e){}
}

async function put(storeName,value,opts={}){
  const copy=(value && typeof value==="object") ? {...value} : value;
  if(copy && typeof copy==="object" && !window.__TONICAO_REMOTE_APPLY__ && !(opts.preserveUpdatedAt && copy.updatedAt)){
    copy.updatedAt=new Date().toISOString();
  }
  const saved=await rawPut(storeName,copy);
  if(saved?.id!==undefined && saved?.id!==null){
    await queueChange(storeName,"put",saved.id,saved,saved.updatedAt);
  }
  return saved;
}

async function removeOne(storeName,id){
  await rawDelete(storeName,id);
  await queueChange(storeName,"delete",id,null,new Date().toISOString());
}

async function clearStore(storeName){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,"readwrite");
    tx.objectStore(storeName).clear();
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}

async function bulkPut(storeName,values){
  for(const value of values||[]) await put(storeName,value);
}

async function getPendingChanges(){
  return (await getAll("syncQueue")).sort((a,b)=>String(a.queuedAt).localeCompare(String(b.queuedAt)));
}

async function ackChanges(ids){
  // ids no formato "q:store:registro@queuedAt": só apaga se não houve alteração nova depois do envio
  for(const raw of ids||[]){
    const str=String(raw), at=str.lastIndexOf("@");
    if(at<0){await rawDelete("syncQueue",str);continue}
    const id=str.slice(0,at), queuedAt=str.slice(at+1);
    const cur=await getOne("syncQueue",id);
    if(cur && cur.queuedAt===queuedAt) await rawDelete("syncQueue",id);
  }
}

async function applyRemoteChange(change){
  if(!change?.store || !SYNCABLE_STORES.has(change.store) || !change.recordId) return false;
  const local=await getOne(change.store,change.recordId);
  const remoteUpdated=change.updatedAt || change.value?.updatedAt || "";
  const localUpdated=local?.updatedAt || "";
  if(local && localUpdated && remoteUpdated && localUpdated > remoteUpdated) return false;

  window.__TONICAO_REMOTE_APPLY__=true;
  try{
    if(change.op==="delete"){
      await rawDelete(change.store,change.recordId);
    }else if(change.op==="put" && change.value){
      const value={...change.value};
      if(remoteUpdated && !value.updatedAt) value.updatedAt=remoteUpdated;
      await rawPut(change.store,value);
    }
  } finally {
    window.__TONICAO_REMOTE_APPLY__=false;
  }
  return true;
}

async function sanitizeAllStores(){
  // Limpa dados antigos uma única vez (sem gerar fila de sincronização)
  for(const [name] of STORE_DEFS){
    if(["syncQueue","authSession","documents"].includes(name)) continue;
    let rows=[];try{rows=await getAll(name)}catch(e){continue}
    for(const r of rows){
      const c=cleanValue(r);
      if(JSON.stringify(c)!==JSON.stringify(r)) await rawPut(name,c);
    }
  }
}

window.DB={
  put,getAll,getOne,removeOne,clearStore,bulkPut,dumpStore:getAll,rawPut,rawDelete,
  getPendingChanges,ackChanges,applyRemoteChange,clean:cleanValue,sanitizeAllStores,
  syncableStores:[...SYNCABLE_STORES]
};
</script>
<script>/* ===== sync.js ===== */
/* ===== sync.js ===== */
const TONICAO_STORES = [
  "students","classSessions","attendance","gradingHistory","gradingPlans",
  "gradingAssignments","gradingReminders","pointsLedger","events","techniques",
  "notifications","paymentStatus","documents","settings","academies","devices",
  "invites","syncLog","academyContent","timerPresets","sequenceRules","syncMeta",
  "users","auditLog","academyTimeline","academyGallery","reportPresets","registrationRequests","academyRules","scoreRules","referenceMaterials"
];

const SECRET_SETTINGS=["cloudToken","cloudSessionToken","remoteUser","remotePushEndpoint","remotePushSubscribed","authUserId"];
const STUDENT_OWN_STORES=["attendance","gradingHistory","gradingAssignments","gradingReminders","pointsLedger","paymentStatus"];
const STUDENT_SHARED_STORES=["academies","techniques","gradingPlans","events","documents","academyContent","academyTimeline","academyGallery","academyRules","scoreRules","referenceMaterials","timerPresets","sequenceRules"];

function b64EncodeUnicode(str){
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach(b=>binary += String.fromCharCode(b));
  return btoa(binary);
}
function b64DecodeUnicode(str){
  const binary = atob(str);
  const bytes = Uint8Array.from(binary, c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function downloadBlob(filename, blob){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

async function blobToDataUrl(blob){
  return await new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
    r.readAsDataURL(blob);
  });
}
function dataUrlToBlob(dataUrl){
  const [meta,b64]=String(dataUrl).split(",");
  const mime=(meta.match(/data:([^;]+)/)||[])[1]||"application/octet-stream";
  const binary=atob(b64||"");
  const arr=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) arr[i]=binary.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
async function serializeValues(store,values){
  if(store!=="documents") return values;
  const out=[];
  for(const v of values||[]){
    const copy={...v};
    if(copy.blob instanceof Blob){
      copy.blobDataUrl=await blobToDataUrl(copy.blob);
      delete copy.blob;
    }
    out.push(copy);
  }
  return out;
}
async function deserializeValues(store,values){
  if(store!=="documents") return values;
  return (values||[]).map(v=>{
    const copy={...v};
    if(copy.blobDataUrl){
      copy.blob=dataUrlToBlob(copy.blobDataUrl);
      delete copy.blobDataUrl;
    }
    return copy;
  });
}

async function exportDatabasePackage(scope="full", studentId=null){
  const payload={
    format:"tonicao-sync",
    version:1,
    generatedAt:new Date().toISOString(),
    scope,
    studentId:studentId||null,
    data:{}
  };
  for(const store of TONICAO_STORES){
    let values=[];
    try{ values=await DB.getAll(store); }catch(e){ values=[]; }
    if(store==="settings"){
      // Nunca exportar credenciais do servidor
      values=values.map(v=>{const c={...v};for(const k of SECRET_SETTINGS)delete c[k];return c});
    }
    if(scope==="student" && studentId){
      if(store==="students") values=values.filter(x=>x.id===studentId);
      else if(STUDENT_OWN_STORES.includes(store)) values=values.filter(x=>x.studentId===studentId);
      else if(store==="settings") values=values.map(v=>({id:v.id,role:"aluno",linkedStudentId:studentId,academyId:v.academyId,academyName:v.academyName,unitName:v.unitName,publicAppUrl:v.publicAppUrl}));
      else if(!STUDENT_SHARED_STORES.includes(store)) values=[]; // users, auditLog, registrationRequests, invites...
    }
    payload.data[store]=await serializeValues(store,values);
  }
  return payload;
}
async function downloadBackup(){
  const payload=await exportDatabasePackage("full");
  const date=new Date().toISOString().slice(0,10);
  downloadBlob(`tonicao-backup-${date}.json`,new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));
}
async function downloadStudentSync(studentId){
  const payload=await exportDatabasePackage("student",studentId);
  const st=(payload.data.students||[])[0];
  const safe=(st?.name||"aluno").replace(/[^\w\-]+/g,"-").toLowerCase();
  downloadBlob(`tonicao-sync-${safe}.json`,new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));
}
async function importDatabasePackage(file, mode="merge"){
  const txt=await file.text();
  const payload=JSON.parse(txt);
  if(payload.format!=="tonicao-sync") throw new Error("Arquivo não reconhecido.");
  // Preserva a conexão com o servidor deste aparelho
  const localSettings=(await DB.getOne("settings","app"))||{id:"app"};
  const keep={};for(const k of [...SECRET_SETTINGS,"cloudEndpoint","cloudEnabled","cloudCursor","deviceId"])if(localSettings[k]!==undefined)keep[k]=localSettings[k];
  if(mode==="replace"){
    for(const store of TONICAO_STORES){
      try{await DB.clearStore(store)}catch(e){}
    }
  }
  for(const [store, values] of Object.entries(payload.data||{})){
    if(!TONICAO_STORES.includes(store)) continue;
    const restored=await deserializeValues(store,values||[]);
    for(let value of restored){
      if(store==="settings"&&value?.id==="app") value={...value,...keep};
      await DB.put(store,value,{preserveUpdatedAt:true}); // não "rejuvenesce" dados antigos do backup
    }
  }
  if(!(payload.data?.settings||[]).some(v=>v.id==="app")&&mode==="replace") await DB.put("settings",{...localSettings,...keep});
  await DB.put("syncLog",{id:"sync-"+Date.now(),direction:"import",scope:payload.scope||"unknown",at:new Date().toISOString(),count:Object.values(payload.data||{}).reduce((a,v)=>a+(v?.length||0),0)});
  return payload;
}
async function buildInviteToken(student, settings){
  const academy={
    academyName:settings.academyName||settings.academy||"Tonicão Team",
    unitName:settings.unitName||settings.unit||"Sul da Ilha",
    academyId:settings.academyId||"tonicao-sul-ilha"
  };
  const secret=crypto.getRandomValues(new Uint32Array(2)).join("");
  const body={
    v:1,type:"student-invite",createdAt:new Date().toISOString(),secret,
    academy,
    student:{
      id:student.id,name:student.name,nickname:student.nickname||student.name.split(" ")[0],
      birth:student.birth||"",belt:student.belt||"Branca",stripes:student.stripes||0,
      classesInBelt:student.classesInBelt||0,targetClasses:student.targetClasses||120,
      points:student.points||0,rank:student.rank||null
    }
  };
  const token="TONICAO1."+b64EncodeUnicode(JSON.stringify(body));
  await DB.put("invites",{id:"inv-"+student.id,studentId:student.id,secret,token,createdAt:body.createdAt,status:"active"});
  return token;
}
function decodeInviteToken(token){
  const t=String(token||"").trim();
  if(!t.startsWith("TONICAO1.")) throw new Error("Convite inválido.");
  const body=JSON.parse(b64DecodeUnicode(t.slice("TONICAO1.".length)));
  if(body.type!=="student-invite" || !body.student?.id) throw new Error("Convite inválido.");
  return body;
}
async function acceptInviteToken(token){
  const body=decodeInviteToken(token);
  const old=await DB.getOne("students",body.student.id);
  const merged={...(old||{}),...body.student,active:true,payment:old?.payment||"liberado",dueDay:old?.dueDay||10,streak:old?.streak||0};
  await DB.put("students",merged);
  const settings=(await DB.getOne("settings","app"))||{id:"app"};
  settings.role="aluno";
  settings.linkedStudentId=body.student.id;
  settings.academyId=body.academy.academyId;
  settings.academyName=body.academy.academyName;
  settings.unitName=body.academy.unitName;
  settings.linkedAt=new Date().toISOString();
  await DB.put("settings",settings);
  await DB.put("devices",{id:"device-local",role:"aluno",studentId:body.student.id,academyId:body.academy.academyId,linkedAt:settings.linkedAt});
  return body;
}

window.TonicaoSync={
  exportDatabasePackage,downloadBackup,downloadStudentSync,importDatabasePackage,
  buildInviteToken,decodeInviteToken,acceptInviteToken
};
</script>

  function uid(prefix="usr"){

  }
  function b64ToBytes(s){
    const bin=atob(s); return Uint8Array.from(bin,c=>c.charCodeAt(0));
  }
  async function deriveHash(password,saltB64,iterations=180000){
    const enc=new TextEncoder();
    const material=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveBits"]);
    const bits=await crypto.subtle.deriveBits({
      name:"PBKDF2",hash:"SHA-256",salt:b64ToBytes(saltB64),iterations
    },material,256);
    return bytesToB64(new Uint8Array(bits));
  }
  // v0.23: mínimo 9 caracteres com maiúscula, minúscula, número e símbolo, em qualquer ordem.
  function passwordProblem(password){
    const p=String(password||"");
    if(p.length<9) return "A senha precisa ter pelo menos 9 caracteres.";
    if(!/[A-Z]/.test(p)) return "A senha precisa ter pelo menos uma letra MAIÚSCULA.";
    if(!/[a-z]/.test(p)) return "A senha precisa ter pelo menos uma letra minúscula.";
    if(!/[0-9]/.test(p)) return "A senha precisa ter pelo menos um número.";
    if(!/[^A-Za-z0-9]/.test(p)) return "A senha precisa ter pelo menos um símbolo, como . ! @ # ou *";
    return "";
  }
  async function makePassword(password){
    const problem=passwordProblem(password);
    if(problem) throw new Error(problem);
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const saltB64=bytesToB64(salt);
    return {salt:saltB64,hash:await deriveHash(password,saltB64),iterations:180000};
  }
  async function verifyPassword(user,password){
    const hash=await deriveHash(password,user.passwordSalt,user.passwordIterations||180000);
    return hash===user.passwordHash;
  }
  async function allUsers(){
    return await DB.getAll("users");
  }
  async function users(){
    return (await allUsers()).filter(u=>u.active!==false);
  }
  async function hasAnyUser(){
    return (await users()).length>0;
  }
  async function hasOwner(){
    return (await users()).some(u=>u.role==="admin");
  }
  async function bootstrapAdmin({name,username,password}){
    if(await hasOwner()) throw new Error("O Administrador/Dono já foi configurado.");
    const pw=await makePassword(password);
    const user={
      id:uid("usr"),name:name.trim(),username:username.trim().toLowerCase().replace(/[<>"'`]/g,""),role:"admin",isOwner:true,
      active:true,passwordSalt:pw.salt,passwordHash:pw.hash,passwordIterations:pw.iterations,
      createdAt:new Date().toISOString()
    };
    await DB.put("users",user);
    await setSession(user);
    await audit("auth.bootstrap","Configuração inicial do administrador",null,{userId:user.id});
    return user;
  }
  async function createUser({name,username,password,role,studentId=""}){
    const current=await currentUser();
    if(!current || !["admin","professor"].includes(current.role)) throw new Error("Sem permissão para criar usuários.");
    if(current.role==="professor" && role!=="aluno") throw new Error("Professor pode criar apenas conta de Aluno.");
    const list=await allUsers();
    const normalized=username.trim().toLowerCase().replace(/[<>"'`]/g,"");
    if(list.some(u=>u.username===normalized)) throw new Error("Este usuário já existe, mesmo que esteja desativado.");
    if(!["admin","professor","aluno"].includes(role)) throw new Error("Perfil inválido.");
    if(role==="admin" && current.role!=="admin") throw new Error("Somente o Administrador/Dono pode criar outro Administrador.");
    if(role==="aluno"&&!studentId) throw new Error("Aluno precisa estar vinculado a uma ficha.");
    const pw=await makePassword(password);
    const user={
      id:uid("usr"),name:name.trim(),username:normalized,role,studentId:role==="aluno"?studentId||"": "",
      active:true,passwordSalt:pw.salt,passwordHash:pw.hash,passwordIterations:pw.iterations,
      createdAt:new Date().toISOString(),createdBy:current.id
    };
    await DB.put("users",user);
    await audit("user.create",`Usuário ${user.username} criado`,studentId||null,{role:user.role,userId:user.id});
    return user;
  }
  async function changePassword(userId,newPassword){
    const current=await currentUser();
    if(!current || (current.role!=="admin" && current.id!==userId)) throw new Error("Sem permissão.");
    const u=await DB.getOne("users",userId); if(!u)throw new Error("Usuário não encontrado.");
    const pw=await makePassword(newPassword);
    u.passwordSalt=pw.salt;u.passwordHash=pw.hash;u.passwordIterations=pw.iterations;
    await DB.put("users",u);
    await audit("user.password","Senha alterada",u.studentId||null,{userId:u.id});
  }
  async function setActive(userId,active){
    const current=await currentUser();
    if(!current || current.role!=="admin") throw new Error("Somente o Administrador/Dono.");
    if(current.id===userId && !active) throw new Error("Você não pode desativar sua própria conta.");
    const u=await DB.getOne("users",userId);if(!u)throw new Error("Usuário não encontrado.");
    if(u.role==="admin"&&!active){
      const admins=(await allUsers()).filter(x=>x.role==="admin"&&x.active!==false);
      if(admins.length<=1)throw new Error("A academia precisa manter pelo menos um Administrador/Dono ativo.");
    }
    u.active=!!active;await DB.put("users",u);
    await audit("user.status",`${active?"Ativou":"Desativou"} usuário ${u.username}`,u.studentId||null,{userId:u.id});
  }

  async function loginFederated(remoteUser){
    if(!remoteUser?.id)throw new Error("Usuário remoto inválido.");
    let local=await DB.getOne("users",remoteUser.id);
    const role=["admin","professor","aluno"].includes(remoteUser.role)?remoteUser.role:"aluno";
    local={
      ...(local||{}),
      id:remoteUser.id,
      name:remoteUser.name||remoteUser.email||"Usuário Google",
      username:remoteUser.username||remoteUser.email||remoteUser.id,
      email:remoteUser.email||"",
      role,
      studentId:remoteUser.studentId||"",
      provider:remoteUser.provider||"remote",
      googleSub:remoteUser.googleSub||"",
      pictureUrl:remoteUser.picture||"",
      active:true,
      createdAt:local?.createdAt||new Date().toISOString()
    };
    await DB.put("users",local);
    await setSession(local);
    await audit("auth.federated","Login remoto realizado",local.studentId||null,{userId:local.id,email:local.email,provider:local.provider});
    return local;
  }

  async function login(username,password){
    const normalized=String(username||"").trim().toLowerCase().replace(/[<>"'`]/g,"");
    const list=await users();
    const user=list.find(u=>u.username===normalized);
    if(!user || !(await verifyPassword(user,password))) throw new Error("Usuário ou senha incorretos.");
    await setSession(user);
    await audit("auth.login","Login realizado",user.studentId||null,{userId:user.id});
    return user;
  }
  async function setSession(user){
    await DB.rawPut?.("authSession",{id:"current",userId:user.id,createdAt:new Date().toISOString()});
    if(!DB.rawPut){
      window.__TONICAO_REMOTE_APPLY__=true;
      try{
        const db=await openDB();
        await new Promise((resolve,reject)=>{
          const tx=db.transaction("authSession","readwrite");
          tx.objectStore("authSession").put({id:"current",userId:user.id,createdAt:new Date().toISOString()});
          tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
        });
      } finally {window.__TONICAO_REMOTE_APPLY__=false;}
    }
    const s=(await DB.getOne("settings","app"))||{id:"app"};
    s.role=user.role==="aluno"?"aluno":"professor";
    s.authUserId=user.id;
    if(user.role==="aluno" && user.studentId)s.linkedStudentId=user.studentId;
    await DB.put("settings",s);
  }
  async function logout(){
    window.__TONICAO_REMOTE_APPLY__=true;
    try{
      const db=await openDB();
      await new Promise((resolve,reject)=>{
        const tx=db.transaction("authSession","readwrite");
        tx.objectStore("authSession").delete("current");
        tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
      });
    } finally {window.__TONICAO_REMOTE_APPLY__=false;}
  }
  async function currentUser(){
    const session=await DB.getOne("authSession","current");
    if(!session)return null;
    const user=await DB.getOne("users",session.userId);
    return user?.active===false?null:user;
  }
  async function audit(action,message,studentId=null,details={}){
    const user=await currentUser();
    const entry={
      id:uid("audit"),at:new Date().toISOString(),action,message,studentId,
      userId:user?.id||null,userName:user?.name||"Sistema",userRole:user?.role||"system",
      details
    };
    window.__TONICAO_REMOTE_APPLY__=true;
    try{
      const db=await openDB();
      await new Promise((resolve,reject)=>{
        const tx=db.transaction("auditLog","readwrite");
        tx.objectStore("auditLog").put(entry);
        tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
      });
    } finally {window.__TONICAO_REMOTE_APPLY__=false;}
    return entry;
  }
  function can(user,perm){
    if(!user)return false;
    const set=PERMS[user.role]||new Set();
    return set.has("*")||set.has(perm);
  }
  async function requirePerm(perm){
    const u=await currentUser();
    if(!can(u,perm)){
      if(u?.role==="admin"&&ACADEMIC_PERMS.has(perm)) throw new Error("Administrador/Dono tem acesso de visualização e manutenção, mas decisões acadêmicas pertencem ao Professor.");
      throw new Error("Sem permissão para esta ação.");
    }
    return u;
  }
  return {
    ROLE_LABEL,hasAnyUser,hasOwner,bootstrapAdmin,createUser,changePassword,setActive,login,logout,passwordProblem,
    currentUser,users,allUsers,can,requirePerm,audit,loginFederated
  };
})();
window.TonicaoAuth=TonicaoAuth;
</script>
<script>/* ===== remote-auth.js ===== */
/* ===== remote-auth.js ===== */
/* v0.22 — Contas e cadastros usando Firebase Authentication + Firestore (plano gratuito).
   Mantém a mesma interface usada pelo app (TonicaoRemoteAuth). */
const TonicaoFirebase=(()=>{
  const cfg=window.TONICAO_FIREBASE||{};
  const configured=!!(window.firebase&&cfg.apiKey&&!/COLE_AQUI/.test(cfg.apiKey)&&cfg.projectId);
  let app=null,auth=null,db=null,storage=null,readyPromise=null;
  if(configured){
    try{
      app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);
      auth=firebase.auth();db=firebase.firestore();try{storage=firebase.storage()}catch(e){storage=null}
      readyPromise=new Promise(res=>{const off=auth.onAuthStateChanged(u=>{off();res(u)})});
    }catch(e){console.warn("Firebase não iniciou",e)}
  }
  function academyId(){return new URLSearchParams(location.search).get("academy")||cfg.academyId||"tonicao-sul-ilha"}
  function acad(){return db.collection("academies").doc(academyId())}
  function meta(){return {_srv:firebase.firestore.FieldValue.serverTimestamp(),_by:auth.currentUser?.uid||"public"}}
  return {
    configured:configured&&!!db,cfg,academyId,acad,meta,
    get auth(){return auth},get db(){return db},get storage(){return storage},
    ready:()=>readyPromise?readyPromise.then(()=>auth.currentUser):Promise.resolve(null)
  };
})();
window.TonicaoFirebase=TonicaoFirebase;

const TonicaoRemoteAuth=(()=>{
  const F=TonicaoFirebase;
  const ERR={
    "auth/invalid-email":"E-mail inválido.","auth/user-not-found":"E-mail ou senha incorretos.","auth/wrong-password":"E-mail ou senha incorretos.",
    "auth/invalid-credential":"E-mail ou senha incorretos.","auth/invalid-login-credentials":"E-mail ou senha incorretos.",
    "auth/email-already-in-use":"Este e-mail já tem conta.","auth/weak-password":"A senha precisa ter pelo menos 6 caracteres.",
    "auth/network-request-failed":"Sem internet.","auth/popup-closed-by-user":"Login cancelado.","auth/too-many-requests":"Muitas tentativas. Aguarde alguns minutos.",
    "permission-denied":"Sem permissão para esta ação.","unavailable":"Servidor indisponível. Verifique a internet."
  };
  function friendly(e){return new Error(ERR[e?.code]||e?.message||"Falha no servidor.")}
  function need(){if(!F.configured)throw new Error("Firebase não configurado (firebase-config.js).")}
  async function settings(){return (await DB.getOne("settings","app"))||{id:"app"}}
  async function markConnected(user){
    const s=await settings();
    s.cloudEnabled=true;s.cloudEndpoint="firebase";s.cloudSessionToken="firebase";s.remoteUser=user;
    s.academyId=F.academyId();
    await DB.put("settings",s);
    /* v0.42: quem conseguiu entrar prova que a academia já existe e tem Dono.
       A partir daí o link de primeira configuração some da tela de entrada deste aparelho. */
    try{window.markAcademyReady&&window.markAcademyReady()}catch(e){}
  }
  function mapMember(uid,m){return {id:uid,name:m.name||m.email||"Usuário",email:m.email||"",username:m.email||uid,role:m.role||"aluno",studentId:m.studentId||"",active:m.active===true,provider:m.provider||"password",picture:m.picture||""}}
  async function memberOf(uid){const d=await F.acad().collection("members").doc(uid).get();return d.exists?mapMember(uid,d.data()):null}

  async function finishSignIn(fbUser,{provider="password"}={}){
    let m=null;
    try{m=await memberOf(fbUser.uid)}catch(e){if(e.code!=="permission-denied")throw friendly(e)}
    if(!m){
      // primeira vez: fica aguardando aprovação do Professor/Administrador
      await F.acad().collection("members").doc(fbUser.uid).set({uid:fbUser.uid,name:fbUser.displayName||fbUser.email||"",email:fbUser.email||"",picture:fbUser.photoURL||"",provider,role:"aluno",studentId:"",active:false,createdAt:new Date().toISOString(),...F.meta()});
      await F.auth.signOut();
      return {pending:true};
    }
    if(!m.active){await F.auth.signOut();return {pending:true}}
    await markConnected(m);
    return {token:"firebase",user:m};
  }

  async function login({username,password}){
    need();
    try{const c=await F.auth.signInWithEmailAndPassword(String(username).trim(),password);const r=await finishSignIn(c.user);
      if(r.pending)throw new Error("Conta aguardando liberação do Professor ou Administrador.");return r}
    catch(e){throw e.code?friendly(e):e}
  }
  async function firstSetup({name,email,password,academyName}){
    need();
    {const prob=TonicaoAuth.passwordProblem?TonicaoAuth.passwordProblem(password):"";if(prob)throw new Error(prob)}
    let cred;
    try{cred=await F.auth.createUserWithEmailAndPassword(email.trim(),password)}
    catch(e){if(e.code==="auth/email-already-in-use")cred=await F.auth.signInWithEmailAndPassword(email.trim(),password).catch(x=>{throw friendly(x)});else throw friendly(e)}
    const uid=cred.user.uid;
    try{await cred.user.updateProfile({displayName:name})}catch(e){}
    const ref=F.acad();
    try{
      await ref.set({name:academyName||"Tonicão Team Sul da Ilha",ownerUid:uid,accessStatus:"active",accessReason:"",createdAt:new Date().toISOString(),...F.meta()});
    }catch(e){
      if(e.code==="permission-denied"){await F.auth.signOut();throw new Error("Esta academia já foi configurada por outro Dono. Entre com sua conta.")}
      throw friendly(e);
    }
    await ref.collection("members").doc(uid).set({uid,name,email:email.trim(),provider:"password",role:"admin",studentId:"",active:true,createdAt:new Date().toISOString(),...F.meta()});
    const user=mapMember(uid,{name,email,role:"admin",active:true});
    await markConnected(user);
    return {token:"firebase",user};
  }
  async function googleSignIn(){
    need();
    const provider=new firebase.auth.GoogleAuthProvider();
    try{provider.setCustomParameters({prompt:"select_account"})}catch(e){} // sempre deixa escolher qual conta Google
    try{
      // janela (popup) funciona também no app instalado; o redirecionamento só entra se o popup for bloqueado
      const c=await F.auth.signInWithPopup(provider);
      return await finishSignIn(c.user,{provider:"google"});
    }catch(e){
      if(e.code==="auth/popup-blocked"){await F.auth.signInWithRedirect(provider);return {redirect:true}}
      throw friendly(e);
    }
  }
  async function googleRedirectResult(){
    if(!F.configured)return null;
    try{const c=await F.auth.getRedirectResult();if(!c?.user)return null;return await finishSignIn(c.user,{provider:"google"})}
    catch(e){throw friendly(e)}
  }
  async function sendPasswordReset(email){need();try{await F.auth.sendPasswordResetEmail(String(email).trim())}catch(e){throw friendly(e)}}
  async function me(){
    if(!F.configured)return null;
    const u=await F.ready();if(!u)return null;
    try{return await memberOf(u.uid)}catch(e){return null}
  }
  async function logout(){
    if(F.configured){try{await F.auth.signOut()}catch(e){}}
    const s=await settings();delete s.cloudSessionToken;delete s.remoteUser;await DB.put("settings",s);
  }

  // ---- Usuários (Administrador; Professor pode liberar alunos) ----
  async function listRemoteUsers(){
    need();
    try{const snap=await F.acad().collection("members").get();return {users:snap.docs.map(d=>mapMember(d.id,d.data()))}}
    catch(e){throw friendly(e)}
  }
  async function updateRemoteUser({userId,role,studentId="",active=true,name=""}){
    need();
    const patch={role,studentId:role==="aluno"?studentId:"",active:!!active,...F.meta()};
    if(name)patch.name=name;
    try{await F.acad().collection("members").doc(userId).update(patch);return {ok:true}}catch(e){throw friendly(e)}
  }
  async function approveGoogleUser({userId,role,studentId=""}){return updateRemoteUser({userId,role,studentId,active:true})}
  async function createRemoteUser({name,username,password,role,studentId=""}){
    need();
    {const prob=TonicaoAuth.passwordProblem?TonicaoAuth.passwordProblem(password):"";if(prob)throw new Error(prob)}
    // app secundário: criar a conta sem desconectar quem está logado
    const second=firebase.apps.find(a=>a.name==="criar-usuario")||firebase.initializeApp(F.cfg,"criar-usuario");
    try{
      const c=await second.auth().createUserWithEmailAndPassword(String(username).trim(),password);
      await F.acad().collection("members").doc(c.user.uid).set({uid:c.user.uid,name,email:String(username).trim(),provider:"password",role,studentId:role==="aluno"?studentId:"",active:true,createdAt:new Date().toISOString(),...F.meta()});
      await second.auth().signOut();
      return {user:{id:c.user.uid}};
    }catch(e){try{await second.auth().signOut()}catch(_){};throw friendly(e)}
  }
  async function resetRemotePassword({userId}){
    const list=(await listRemoteUsers()).users;const u=list.find(x=>x.id===userId);
    if(!u?.email)throw new Error("Usuário sem e-mail.");
    await sendPasswordReset(u.email);return {ok:true,emailSent:true};
  }
  async function remotePermissions(){
    const m=await me();if(!m)throw new Error("Entre na conta da academia.");
    const map={professor:["alunos","presenças","graduação","pontos","eventos","técnicas","regras","conteúdo","convites"],admin:["conteúdo da academia","usuários","bloqueio do sistema"],aluno:["check-in próprio","progresso da própria graduação"]};
    return {role:m.role,writeStores:map[m.role]||[]};
  }

  // ---- Convites e pré-cadastros ----
  const inv=()=>F.acad().collection("registrationInvites");
  function randomToken(){const b=crypto.getRandomValues(new Uint8Array(18));return Array.from(b,x=>x.toString(16).padStart(2,"0")).join("")}
  const docToReq=d=>{const x=d.data();delete x._srv;delete x._by;return {...x,id:d.id,inviteToken:x.inviteToken||d.id}};
  async function createRegistrationInvite({name,phone}){
    need();const token=randomToken();
    const req={name,phone,status:"invited",source:"professor_invite",inviteToken:token,createdAt:new Date().toISOString(),expiresAtMs:Date.now()+72*3600e3};
    try{await inv().doc(token).set({...req,...F.meta()});return {request:{...req,id:token}}}catch(e){throw friendly(e)}
  }
  async function getRegistrationInvite(token){
    need();
    try{
      const d=await inv().doc(token).get();if(!d.exists)return {};
      const req=docToReq(d);
      if(req.status==="invited"&&Number(req.expiresAtMs||0)>0&&Date.now()>Number(req.expiresAtMs))req.status="expired";
      return {request:req}
    }catch(e){throw friendly(e)}
  }
  const COMPLETE_FIELDS=["name","phone","email","birth","graduationTrack","belt","stripes","guardianName","guardianPhone","emergencyName","emergencyPhone","note","privacyConsentAt","guardianConsentAt"];
  async function completeRegistrationInvite(token,payload){
    need();
    try{
      const ref=inv().doc(token),snap=await ref.get();
      if(!snap.exists)throw new Error("Convite não encontrado.");
      const current=snap.data()||{};
      if(current.status!=="invited")throw new Error("Este convite já foi utilizado ou encerrado.");
      if(Number(current.expiresAtMs||0)>0&&Date.now()>Number(current.expiresAtMs))throw new Error("Este convite venceu. Peça um novo link ao Professor.");
      const patch={status:"awaiting_approval",completedAt:new Date().toISOString(),...F.meta()};
      for(const k of COMPLETE_FIELDS)patch[k]=k==="stripes"?Number(payload[k]||0):String(payload[k]??"").slice(0,300);
      await ref.update(patch);return getRegistrationInvite(token)
    }catch(e){throw e?.code?friendly(e):e}
  }
  async function submitRegistrationRequest(payload){
    need();const id=randomToken();
    const req={name:String(payload.name||"").slice(0,120),phone:String(payload.phone||"").slice(0,40),birth:String(payload.birth||"").slice(0,10),graduationTrack:payload.graduationTrack==="kids"?"kids":"adulto",guardianName:String(payload.guardianName||"").slice(0,120),guardianPhone:String(payload.guardianPhone||"").slice(0,40),note:String(payload.note||"").slice(0,300),privacyConsentAt:String(payload.privacyConsentAt||"").slice(0,40),guardianConsentAt:String(payload.guardianConsentAt||"").slice(0,40),status:"pending",source:"self",inviteToken:id,createdAt:new Date().toISOString()};
    try{await inv().doc(id).set({...req,...F.meta()});return {request:{...req,id}}}catch(e){throw friendly(e)}
  }
  async function deleteRegistrationInvite(token){
    need();
    try{await inv().doc(token).delete();return {ok:true}}catch(e){throw friendly(e)}
  }
  async function listRegistrationRequests(){
    need();
    try{const snap=await inv().where("status","in",["invited","awaiting_approval","pending"]).get();return {requests:snap.docs.map(docToReq)}}catch(e){throw friendly(e)}
  }
  async function decideRegistrationRequest({requestId,status,studentId=""}){
    need();
    try{await inv().doc(requestId).update({status,studentId,decidedAt:new Date().toISOString(),...F.meta()});return {ok:true}}catch(e){throw friendly(e)}
  }

  // ---- Bloqueio da academia ----
  async function getAcademyAccess(){need();const d=await F.acad().get();const x=d.data()||{};return {status:x.accessStatus||"active",reason:x.accessReason||""}}
  async function setAcademyAccess({status,reason=""}){need();try{await F.acad().update({accessStatus:status,accessReason:reason,...F.meta()});return {ok:true}}catch(e){throw friendly(e)}}

  // ---- Compatibilidade (push remoto exige servidor pago; avisos chegam pela sincronização) ----
  async function googleConfig(){return {enabled:F.configured}}
  async function googleLogin(){return googleSignIn()}
  async function bootstrap(){throw new Error("Use a Primeira configuração na tela de entrada.")}
  async function listRemoteNotifications(after=0){return {notifications:[],cursor:after}}
  async function markRemoteNotificationsRead(){return {ok:true}}
  async function pushConfig(){return {enabled:false}}
  async function savePushSubscription(){return {ok:false}}
  async function removePushSubscription(){return {ok:false}}

  return {login,firstSetup,googleSignIn,googleRedirectResult,sendPasswordReset,me,logout,listRemoteUsers,approveGoogleUser,createRemoteUser,updateRemoteUser,resetRemotePassword,remotePermissions,
    createRegistrationInvite,getRegistrationInvite,completeRegistrationInvite,submitRegistrationRequest,listRegistrationRequests,decideRegistrationRequest,deleteRegistrationInvite,
    getAcademyAccess,setAcademyAccess,googleConfig,googleLogin,bootstrap,listRemoteNotifications,markRemoteNotificationsRead,pushConfig,savePushSubscription,removePushSubscription};
})();
window.TonicaoRemoteAuth=TonicaoRemoteAuth;

<script>/* ===== remote-sync.js ===== */
/* ===== remote-sync.js ===== */
/* v0.22 — Sincronização direta com o Firestore (plano gratuito, sem servidor).
   As permissões são garantidas pelas regras do Firestore (firestore.rules).
   Tudo continua salvo primeiro no aparelho (IndexedDB). */
const TonicaoCloud=(()=>{
  const F=TonicaoFirebase;
  let syncing=false,debounceTimer=null,periodicTimer=null;

  const NEVER_PUSH=new Set(["users","auditLog","registrationRequests","settings"]);
  const SHARED=["techniques","gradingPlans","events","academyContent","academyTimeline","academyGallery","academyRules","scoreRules","referenceMaterials","timerPresets","sequenceRules","classSessions","classSchedule"];
  const STUDENT_OWN=["attendance","gradingHistory","gradingAssignments","gradingReminders","pointsLedger","paymentStatus","classBookings"];
  const PROF_WRITE=new Set(["students","classSessions","attendance","gradingHistory","gradingPlans","gradingAssignments","gradingReminders","pointsLedger","events","techniques","notifications","paymentStatus","timerPresets","sequenceRules","scoreRules","academyRules","academyContent","academyTimeline","academyGallery","referenceMaterials","classSchedule","classBookings"]);
  const ADMIN_WRITE=new Set(["academyContent","academyTimeline","academyGallery","referenceMaterials","notifications"]);
  const INDEX_FIELDS=["studentId","status","sessionId","targetStudentId","targetRole","payment","active"];
  const PUBLIC_STUDENT=["id","name","nickname","belt","stripes","points","graduationTrack","photo","active","updatedAt"];

  async function settings(){return (await DB.getOne("settings","app"))||{id:"app"}}
  async function saveSettings(patch){const s=await settings();Object.assign(s,patch);await DB.rawPut("settings",s);return s}
  const col=name=>F.acad().collection(name);
  const clone=v=>JSON.parse(JSON.stringify(v??null));

  // ---------- conversão local <-> Firestore ----------
  function toDoc(store,value){
    const v=clone(value)||{};
    const doc={id:String(v.id),json:"",...F.meta()};
    for(const k of INDEX_FIELDS)if(v[k]!==undefined&&v[k]!==null)doc[k]=v[k];
    if(store==="classSessions"){delete v.code;delete v.prevCode;delete v.nextCode}
    if(store==="gradingAssignments"){if(v.evaluation)delete v.evaluation.privateNote;doc.progress=v.progress||{}}
    doc.json=JSON.stringify(v);
    return doc;
  }
  function fromDoc(store,snap){
    const d=snap.data()||{};
    let value;
    if(d.json){try{value=JSON.parse(d.json)}catch(e){value={}}}
    else{value={...d};delete value._srv;delete value._by;delete value._deleted;delete value.json}
    if(store==="gradingAssignments"&&d.progress)value.progress=d.progress;
    if(store==="attendance"&&d.status)value.status=d.status;
    value.id=value.id||snap.id;
    const srv=d._srv?.toMillis?d._srv.toMillis():0;
    return {store,op:d._deleted?"delete":"put",recordId:snap.id,value:d._deleted?null:value,updatedAt:value?.updatedAt||"",srv};
  }
  function extraWrites(store,value,batch,deleting){
    const id=String(value.id);
    if(store==="students"){
      const pub={};for(const k of PUBLIC_STUDENT)if(value[k]!==undefined)pub[k]=value[k];
      batch.set(col("studentsPublic").doc(id),deleting?{_deleted:true,...F.meta()}:{id,json:JSON.stringify(pub),...F.meta()},{merge:deleting});
    }
    if(store==="classSessions"&&!deleting&&value.code){
      const start=Date.parse(value.createdAt)||Date.now();
      const exp=Date.parse(value.expiresAt)||start+3*3600e3;
      const closed=value.status==="closed"?(Date.parse(value.closedAt)||Date.now()):null;
      batch.set(col("sessionCodes").doc(id),{id,code:String(value.code),prevCode:String(value.prevCode||""),nextCode:String(value.nextCode||""),startMs:start,endMs:closed?Math.min(closed,exp):exp,...F.meta()});
    }
    if(store==="gradingAssignments"&&!deleting){
      batch.set(col("gradingPrivate").doc(id),{id,privateNote:value.evaluation?.privateNote||"",...F.meta()});
    }
  }

  async function applyLocal(change){
    window.__TONICAO_REMOTE_APPLY__=true;
    try{
      if(change.op==="delete")await DB.rawDelete(change.store,change.recordId);
      else await DB.rawPut(change.store,change.value);
    }finally{window.__TONICAO_REMOTE_APPLY__=false}
  }
  async function patchLocal(store,id,fn){
    const cur=await DB.getOne(store,id);if(!cur)return;
    window.__TONICAO_REMOTE_APPLY__=true;try{await DB.rawPut(store,fn({...cur}))}finally{window.__TONICAO_REMOTE_APPLY__=false}
  }

  // ---------- envio ----------
  async function push(me){
    const pending=await DB.getPendingChanges();
    const rejected=[];let pushed=0;
    for(const q of pending){
      const ackId=`${q.id}@${q.queuedAt}`;
      const allowed=me.role==="professor"?PROF_WRITE.has(q.store):me.role==="admin"?ADMIN_WRITE.has(q.store):["attendance","gradingAssignments","classBookings"].includes(q.store);
      if(NEVER_PUSH.has(q.store)||!DB.syncableStores.includes(q.store)){await DB.ackChanges([ackId]);continue}
      if(!allowed){await DB.ackChanges([ackId]);await revert(q.store,q.recordId);continue} // volta à versão oficial
      try{
        if(me.role==="aluno"){
          if(q.store==="classBookings"){
            // reserva do aluno: cria/cancela só a própria, enquanto pendente
            if(q.op==="delete")await col("classBookings").doc(q.recordId).set({_deleted:true,...F.meta()},{merge:true});
            else{const v=q.value;await col("classBookings").doc(q.recordId).set({id:q.recordId,scheduleId:v.scheduleId,date:v.date,studentId:v.studentId,status:"pending",createdAt:v.createdAt||new Date().toISOString(),...F.meta()})}
            await DB.ackChanges([ackId]);pushed++;continue;
          }
          if(q.op!=="put")throw {code:"permission-denied"};
          const v=q.value;
          if(q.store==="attendance"){
            // check-in: o Firestore confere código, horário da aula e pagamento
            await col("attendance").doc(q.recordId).set({id:q.recordId,studentId:v.studentId,sessionId:v.sessionId,date:v.date,time:v.time,source:"qr-codigo",status:"pending",checkinCode:String(v.checkinCode||""),...F.meta()});
          }else{
            await col("gradingAssignments").doc(q.recordId).update({progress:v.progress||{},...F.meta()});
          }
        }else{
          const batch=F.db.batch();
          if(q.op==="delete"){
            batch.set(col(q.store).doc(q.recordId),{_deleted:true,...F.meta()},{merge:true});
            extraWrites(q.store,{id:q.recordId},batch,true);
          }else{
            batch.set(col(q.store).doc(q.recordId),toDoc(q.store,q.value));
            extraWrites(q.store,q.value,batch,false);
          }
          await batch.commit();
        }
        await DB.ackChanges([ackId]);pushed++;
      }catch(e){
        if(e?.code==="permission-denied"||e?.code==="not-found"){
          await DB.ackChanges([ackId]);
          const reason=q.store==="attendance"?"código inválido, aula encerrada ou pagamento pendente":"sem permissão";
          rejected.push({changeId:ackId,store:q.store,recordId:q.recordId,reason});
          await revert(q.store,q.recordId);
        }else throw e; // sem internet etc.: fica na fila
      }
    }
    return {pushed,rejected};
  }
  async function revert(store,id){
    try{
      const snap=await col(store).doc(id).get();
      if(!snap.exists){await applyLocal({store,op:"delete",recordId:id});return}
      await applyLocal(fromDoc(store,snap));
    }catch(e){
      if(e?.code==="permission-denied"&&store==="attendance")await applyLocal({store,op:"delete",recordId:id});
    }
  }

  // ---------- recebimento ----------
  async function pullQuery(key,query,store,cursors,onChange){
    try{return await pullQueryIndexed(key,query,store,cursors,onChange)}
    catch(e){
      if(e?.code!=="failed-precondition")throw e;
      // índice ainda não criado no Firestore: baixa tudo desta consulta (funciona, só gasta mais leituras)
      const link=(String(e.message||"").match(/https:\/\/console\.firebase\.google\.com\S+/)||[])[0];
      if(link)try{await saveSettings({cloudIndexHint:link})}catch(_){}
      const snap=await query.limit(1000).get();let max=cursors[key]||0;
      for(const d of snap.docs){const ch=fromDoc(store,d);max=Math.max(max,ch.srv);await onChange(ch)}
      cursors[key]=max;return snap.size;
    }
  }
  async function pullQueryIndexed(key,query,store,cursors,onChange){
    const since=firebase.firestore.Timestamp.fromMillis(Math.max(0,(cursors[key]||0)-120000));
    let q=query.where("_srv",">=",since).orderBy("_srv").limit(300),last=null,max=cursors[key]||0,count=0;
    for(;;){
      const snap=await(last?q.startAfter(last):q).get();
      for(const d of snap.docs){const ch=fromDoc(store,d);max=Math.max(max,ch.srv);await onChange(ch);count++}
      if(snap.size<300)break;last=snap.docs[snap.docs.length-1];
    }
    cursors[key]=max;return count;
  }
  async function pull(me,cursors){
    let applied=0;
    const apply=async ch=>{if(await DB.applyRemoteChange(ch))applied++};
    if(me.role==="aluno"){
      const sid=me.studentId;
      for(const st of SHARED)await pullQuery(st,col(st),st,cursors,apply);
      await pullQuery("studentsPublic",col("studentsPublic"),"students",cursors,async ch=>{if(ch.recordId!==sid)await apply(ch)});
      if(sid){
        const own=await col("students").doc(sid).get();
        if(own.exists)await apply(fromDoc("students",own));
        for(const st of STUDENT_OWN)await pullQuery(st,col(st).where("studentId","==",sid),st,cursors,apply);
        await pullQuery("notif-student",col("notifications").where("targetStudentId","==",sid),"notifications",cursors,apply);
      }
      await pullQuery("notif-role",col("notifications").where("targetRole","==","aluno"),"notifications",cursors,apply);
      return applied;
    }
    const stores=DB.syncableStores.filter(s=>!NEVER_PUSH.has(s));
    for(const st of stores)await pullQuery(st,col(st),st,cursors,apply);
    await pullQuery("sessionCodes",col("sessionCodes"),"sessionCodes",cursors,async ch=>{if(ch.value?.code)await patchLocal("classSessions",ch.recordId,s=>({...s,code:ch.value.code,prevCode:ch.value.prevCode||"",nextCode:ch.value.nextCode||""}))});
    await pullQuery("gradingPrivate",col("gradingPrivate"),"gradingPrivate",cursors,async ch=>{if(ch.value)await patchLocal("gradingAssignments",ch.recordId,a=>({...a,evaluation:{...(a.evaluation||{}),privateNote:ch.value.privateNote||""}}))});
    if(me.role==="professor"){
      // inclui check-ins que ficaram pendentes em sincronizações anteriores
      const pend=(await DB.getAll("attendance")).filter(a=>a.status==="pending");
      for(const a of pend)await confirmPendingAttendance(a.id);
    }
    return applied;
  }

  // Professor confirma (uma única vez, mesmo com vários celulares) e lança os pontos
  async function confirmPendingAttendance(id){
    const ref=col("attendance").doc(id);
    let data=null;
    try{
      await F.db.runTransaction(async tx=>{
        const snap=await tx.get(ref);const d=snap.data();
        if(!d||d.status!=="pending"){data=null;return}
        data={id,studentId:d.studentId,sessionId:d.sessionId,date:d.date,time:d.time,source:d.source,status:"approved",validatedBy:"firestore"};
        tx.set(ref,{id,studentId:d.studentId,sessionId:d.sessionId,status:"approved",json:JSON.stringify(data),...F.meta()});
      });
    }catch(e){console.warn("Confirmação de presença",e);return}
    if(!data)return;
    window.__TONICAO_REMOTE_APPLY__=true;try{await DB.rawPut("attendance",data)}finally{window.__TONICAO_REMOTE_APPLY__=false}
    if(typeof window.awardAttendancePoints==="function")await window.awardAttendancePoints(data.studentId,data.sessionId);
  }

  // ---------- conta e academia ----------
  async function refreshMembership(){
    const fbUser=await F.ready();
    if(!fbUser)return null;
    const snap=await F.acad().collection("members").doc(fbUser.uid).get();
    const m=snap.exists?snap.data():null;
    if(!m||m.active!==true){try{window.dispatchEvent(new CustomEvent("tonicao:cloud-revoked"))}catch(e){};return null}
    const me={id:fbUser.uid,name:m.name||m.email||"Usuário",email:m.email||"",username:m.email||fbUser.uid,role:m.role,studentId:m.studentId||"",picture:m.picture||""};
    const local=await TonicaoAuth.currentUser();
    if(local&&local.id===me.id&&(local.role!==me.role||(local.studentId||"")!==me.studentId||local.name!==me.name))await TonicaoAuth.loginFederated(me);
    try{
      const ac=(await F.acad().get()).data()||{};
      const s=await settings();
      if(s.academyAccessStatus!==(ac.accessStatus||"active")||s.academyAccessReason!==(ac.accessReason||""))await saveSettings({academyAccessStatus:ac.accessStatus||"active",academyAccessReason:ac.accessReason||""});
      if(ac.accessStatus==="blocked"&&me.role!=="admin")return {...me,blocked:true};
    }catch(e){}
    return me;
  }

  async function getStatus(){
    const s=await settings();
    return {enabled:!!(F.configured&&s.cloudSessionToken),endpoint:"Firebase",pending:(await DB.getPendingChanges()).length,lastSync:s.cloudLastSync||"",lastError:s.cloudLastError||"",cursor:0,online:navigator.onLine,configured:F.configured};
  }
  async function saveConfig(){return getStatus()}
  async function testConnection(){if(!F.configured)throw new Error("Preencha o firebase-config.js.");await F.acad().collection("members").limit(1).get().catch(e=>{if(e.code!=="permission-denied")throw e});return {ok:true}}

  async function syncNow({silent=false}={}){
    if(syncing)return getStatus();
    const fail=msg=>{if(!silent)throw new Error(msg);return getStatus()};
    if(!F.configured)return fail("Firebase não configurado.");
    if(!navigator.onLine)return fail("Sem internet. Os dados permanecem salvos no aparelho.");
    const s=await settings();
    if(!s.cloudSessionToken)return fail("Entre com a conta da academia.");
    syncing=true;
    try{
      const me=await refreshMembership();
      if(!me)throw new Error("Conta desativada ou aguardando liberação.");
      if(me.blocked)throw new Error("Academia bloqueada pelo Administrador.");
      const {pushed,rejected}=await push(me);
      const cursors={...(s.cloudCursors||{})};
      if(s.cloudCursorsOwner!==me.id+":"+me.role+":"+me.studentId){for(const k in cursors)delete cursors[k]} // troca de conta/perfil: baixa tudo de novo
      const applied=await pull(me,cursors);
      await saveSettings({cloudCursors:cursors,cloudCursorsOwner:me.id+":"+me.role+":"+me.studentId,cloudLastSync:new Date().toISOString(),cloudLastError:rejected.length?`${rejected.length} alteração(ões) recusada(s) pelas regras do servidor.`:""});
      await DB.rawPut("syncLog",{id:"cloud-"+Date.now(),direction:"cloud",at:new Date().toISOString(),pushed,applied});
      if(rejected.length){try{window.dispatchEvent(new CustomEvent("tonicao:sync-rejected",{detail:rejected}))}catch(e){}}
      const out={...await getStatus(),pushed,applied,rejected:rejected.length};
      if(pushed||applied||rejected.length){try{window.dispatchEvent(new CustomEvent("tonicao:data-synced",{detail:out}))}catch(e){}}
      return out;
    }catch(err){
      const msg=err?.code==="permission-denied"?"Sem permissão no servidor.":(err?.message||String(err));
      await saveSettings({cloudLastError:msg});
      if(!silent)throw new Error(msg);
      return {...await getStatus(),error:msg};
    }finally{syncing=false}
  }
  function schedule(delay=1800){clearTimeout(debounceTimer);debounceTimer=setTimeout(()=>syncNow({silent:true}),delay)}
  function start(){
    if(!F.configured)return;
    window.addEventListener("online",()=>schedule(500));
    window.addEventListener("tonicao:queue-change",()=>schedule(1600));
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)schedule(800)});
    clearInterval(periodicTimer);
    periodicTimer=setInterval(()=>{if(navigator.onLine&&!document.hidden)syncNow({silent:true})},60000);
    setTimeout(()=>syncNow({silent:true}),2500);
  }
  async function uploadAll(){
    // Professor: coloca na fila todos os registros deste aparelho (migração da versão sem servidor)
    let n=0;
    for(const st of PROF_WRITE){
      if(st==="attendance"){for(const a of await DB.getAll(st))if(a.status!=="pending"){await DB.put(st,a,{preserveUpdatedAt:true});n++};continue}
      for(const v of await DB.getAll(st)){await DB.put(st,v,{preserveUpdatedAt:true});n++}
    }
    return n;
  }
  // Professor com a tela do QR aberta: recebe cada check-in em tempo real (1 leitura por aluno)
  function watchSession(sessionId,onChange){
    try{
      if(!F.configured)return null;
      const q=col("attendance").where("sessionId","==",sessionId);
      if(typeof q.onSnapshot!=="function")return null;
      return q.onSnapshot(async snap=>{
        for(const d of snap.docs){
          const ch=fromDoc("attendance",d);await DB.applyRemoteChange(ch);
          if(ch.value?.status==="pending")await confirmPendingAttendance(ch.recordId);
        }
        try{onChange&&onChange()}catch(e){}
      },err=>console.warn("watchSession",err));
    }catch(e){console.warn("watchSession",e);return null}
  }
  return {getStatus,saveConfig,testConnection,syncNow,schedule,start,confirmPendingAttendance,uploadAll,watchSession};
})();
window.TonicaoCloud=TonicaoCloud;
window.addEventListener("load",()=>TonicaoCloud.start());
</script>
<script>/* ===== google-auth.js ===== */
