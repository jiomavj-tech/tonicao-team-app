name: Aplicar v0.32 Família

on:
  workflow_dispatch:
  push:
    paths:
      - "apply_v032.py"
      - "features-v032-family.js"
      - "regras-firestore-v032.txt"
      - ".github/workflows/apply-v032.yml"

permissions:
  contents: write

jobs:
  familia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar v0.32
        run: python3 apply_v032.py

      - name: Verificar JavaScript
        run: node --check features-v032-family.js

      - name: Verificar diff
        run: git diff --check

      - name: Publicar v0.32
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada para publicar."
            exit 0
          fi
          git commit -m "v0.32: família, dependentes e check-in pelo responsável"
          git push
