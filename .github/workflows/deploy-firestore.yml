name: Publicar regras do Firestore

on:
  push:
    branches: [main]
    paths: ["regras-firestore.txt"]
  workflow_dispatch:

jobs:
  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar arquivos
        run: |
          cp regras-firestore.txt firestore.rules
          printf '{"firestore":{"rules":"firestore.rules"}}' > firebase.json
      - name: Gravar a chave
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$KEY" > /home/runner/key.json
          node -e "const k=require('/home/runner/key.json'); if(!k.client_email) throw new Error('A chave FIREBASE_SERVICE_ACCOUNT está incompleta'); console.log('Chave OK:', k.client_email)"
      - name: Publicar regras
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/key.json
        run: npx -y firebase-tools@13 deploy --only firestore:rules --project tonicao-sul-ilha --non-interactive
